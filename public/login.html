<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 月度资产负债表</title>
  <link rel="stylesheet" href="/style.css?v=20261122">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232e6be6'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'>¥</text></svg>">
</head>
<body class="login-body">
  <form class="login-card" id="loginForm">
    <div class="login-logo">¥</div>
    <h1>月度资产负债表</h1>
    <p class="muted">输入访问密码后查看你的资产负债数据</p>
    <input type="password" id="password" placeholder="访问密码" autocomplete="current-password" autofocus>
    <button class="btn primary block" type="submit" id="loginBtn">进入</button>
    <p class="login-err" id="loginErr" hidden></p>
  </form>
  <p class="login-foot muted">数据只存在你自己的服务器上</p>

  <script>
    const form = document.getElementById('loginForm');
    const err = document.getElementById('loginErr');
    const btn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      btn.disabled = true;
      btn.textContent = '验证中…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || '登录失败');
        location.replace('/');
      } catch (e2) {
        err.textContent = e2.message;
        err.hidden = false;
        btn.disabled = false;
        btn.textContent = '进入';
      }
    });
  </script>
</body>
</html>
