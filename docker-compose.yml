services:
  balance:
    image: monthly-balance-sheet:2.0.0
    build: .
    container_name: balance
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8899}:8080"
    volumes:
      - ./data:/app/data                 # 现金、负债、投资组合全部存在这里
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_DAYS=${AUTH_DAYS:-30}
      - FX_USD_CNY=${FX_USD_CNY:-}
      - FX_HKD_CNY=${FX_HKD_CNY:-}
